<style>
:root{--bg:#0A0A0A;--fg:#FFFFFF;--mut:rgba(255,255,255,.58);--line:rgba(255,255,255,.14);--card:#141414;--acc:#37FF08;--red:#FF5A4F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 'Geologica',system-ui,sans-serif}
h1,h2{font-family:Unbounded,'Geologica',sans-serif;font-weight:800;margin:0}
h1{font-size:22px}h1 b{color:var(--acc)}
h2{font-size:15px;margin:0 0 12px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:800;color:var(--fg);background:none;border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
button.main{background:var(--acc);border-color:var(--acc);color:#0A0A0A}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.kpi b{display:block;font:800 28px/1.15 Unbounded,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.note{font-size:13px;color:var(--mut)}
.demo{background:rgba(55,255,8,.1);border:1px solid var(--acc);color:var(--acc);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;margin-bottom:14px}
.err{background:rgba(255,90,79,.12);border:1px solid var(--red);color:#ffb3ad;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.best td{color:var(--acc);font-weight:800}
.tblw{overflow-x:auto}
.fun{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:14px}
.fr .bar{height:22px;border-radius:0 4px 4px 0;background:var(--acc);min-width:2px}
.fr .track{background:rgba(255,255,255,.06);border-radius:4px}
.fr b{text-align:right;font-variant-numeric:tabular-nums}
.fr small{display:block;color:var(--mut);font-size:11px;font-weight:700}
.days{position:relative}
.days svg{width:100%;height:180px;display:block}
.tip{position:fixed;pointer-events:none;background:#fff;color:#0A0A0A;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;display:none;z-index:9;white-space:nowrap}
.setup label{display:block;font-size:13px;font-weight:800;margin:10px 0 4px}
.setup input{width:100%;font:inherit;color:var(--fg);background:#0A0A0A;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.setup ol{margin:8px 0 0;padding-left:20px;color:var(--mut);font-size:13px}
.setup a{color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hide{display:none}
@media (max-width:520px){.fr{grid-template-columns:110px 1fr 58px}.kpi b{font-size:24px}}
body{font-variation-settings:'SHRP' 100}
</style>

<style>.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}.chips b{color:var(--acc)}</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <h1>Пульт <b>Пня</b></h1>
  <div class="seg" id="per"><button data-d="7">7 дней</button><button data-d="30" class="on">30 дней</button><button data-d="3650">Всё время</button></div>
  <div class="seg"><button id="csv">Площадки в CSV</button><button id="gear">Настройки</button></div>
 </div>
 <div id="msg"></div>
 <div class="card setup hide" id="setup">
  <h2>Подключение к таблице статистики</h2>
  <p class="note">Пароль хранится только в этом браузере. Без пароля пульт ничего не покажет, поэтому делиться ссылкой на пульт безопасно.</p>
  <div id="urlbox"><label for="url">Адрес счётчика (из НАСТРОЙКИ.txt, строка STATS)</label><input id="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <label for="key">Пароль пульта (тот, что вписан в код таблицы)</label><input id="key" type="password" autocomplete="off">
  <div class="row"><button class="main" id="save">Сохранить и загрузить</button><button id="demo">Посмотреть на демо-данных</button><button id="forget">Забыть пароль</button></div>
 </div>
 <div id="out"></div>
</div>
<div class="tip" id="tip"></div>
